name: build

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish to NuGet
        required: true
        type: string

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Set version variable
        run: |
          if [[ '${{ github.ref_type }}' == 'tag' ]]; then
            echo "NUGET_VERSION=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV
          else
            echo "NUGET_VERSION=0.0.0" >> $GITHUB_ENV
          fi

      - name: Info
        run: echo 'Building ${{ github.ref }} with version ${{ env.NUGET_VERSION }}'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: make test config=Release

      - name: Pack
        run: make pack config=Release version=${{ env.NUGET_VERSION }} 

      - name: Upload NuGet
        uses: actions/upload-artifact@v4
        with:
          path: .out/*.nupkg
          include-hidden-files: true
          name: nugets

  publish:
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'push' && github.ref_type == 'tag' && needs.build.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    environment: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Info
        run: echo 'Building ${{ github.ref }}'

      - name: Download package from build
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: nugets
          path: .out

      - name: Download package from GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --dir .out \
            --pattern "MagnusOpera.OpenApiGen.$RELEASE_TAG.nupkg" -- "$RELEASE_TAG"

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pct-magnusopera

      - name: Publish NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push '.out/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
